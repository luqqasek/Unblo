[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-localization"
version = "0.1.0"
description = "European AI Championship Task 1 workspace"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10", "torch==2.5.1", "torchvision==0.20.1", "huggingface-hub>=0.30", "tqdm>=4.66"]

[project.optional-dependencies]
dev = ["pytest>=8", "ipykernel>=6", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
