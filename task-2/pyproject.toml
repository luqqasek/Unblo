[project]
name = "meq"
version = "0.1.0"
description = "Workspace for the Model Equality challenge (task 33-model-equality)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.28",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.scripts]
meq = "meq.cli:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
